services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: kms_user
      POSTGRES_PASSWORD: kms_password
      POSTGRES_DB: kms_db
    ports:
      - "${DATABASE_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kms_user -d kms_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # neo4j:
  #   image: neo4j:5.26-community
  #   container_name: neo4j
  #   ports:
  #     - "${NEO4J_HTTP_PORT:-7474}:7474"
  #     - "${NEO4J_BOLT_PORT:-7687}:7687"
  #   environment:
  #     - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-12345678}
  #     - NEO4J_PLUGINS='["apoc"]'
  #   volumes:
  #     - neo4j_data:/data
  #   healthcheck:
  #     test: wget http://localhost:7474 || exit 1
  #     interval: 1s
  #     timeout: 10s
  #     retries: 20
  #     start_period: 3s

  redis:
    image: redis/redis-stack-server:latest
    container_name: redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT_ALLOW_RECOVERY_MODE=true

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO to be ready...';
      /usr/bin/mc alias set myminio http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY};
      /usr/bin/mc mb myminio/$${MINIO_BUCKET} --ignore-existing;
      /usr/bin/mc policy set public myminio/$${MINIO_BUCKET};
      echo 'MinIO initialization complete';
      exit 0;
      "

  # nginx:
  #   image: nginx:alpine
  #   container_name: nginx
  #   ports:
  #     - "8080:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - kms-app

  worker:
    image: hapt
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ../:/app:cached
    environment:
      - REDIS_URI=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://kms_user:kms_password@postgres:5432/kms_db
      - VECTOR_STORAGE_URL=http://qdrant:6333
      - VECTOR_COLLECTION_NAME=${VECTOR_COLLECTION_NAME}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - MINIO_SECURE=${MINIO_SECURE}
      - RERANK_URL=${RERANK_URL}
      - RERANK_API_KEY=${RERANK_API_KEY}
      - TEXT_EMBEDDING_URL=${TEXT_EMBEDDING_URL}
      - TEXT_EMBEDDING_API_KEY=${TEXT_EMBEDDING_API_KEY}
      - TEXT_EMBEDDING_MODEL=${TEXT_EMBEDDING_MODEL}
      - NTQAI_BASE_URL=${NTQAI_BASE_URL}
      - NTQAI_API_KEY=${NTQAI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_API_MODEL=${GOOGLE_API_MODEL}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS}
      - NTQAI_MODEL=${NTQAI_MODEL}
      - TEMPERATURE=${TEMPERATURE}
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
    command: python -m src.worker

  prometheus:
    image: prom/prometheus:v2.47.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../etc/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      - worker

  jaeger:
    image: jaegertracing/all-in-one:1.50
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  grafana:
    image: grafana/grafana-oss:10.1.5
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger

  langfuse:
      image: langfuse/server:latest
      container_name: langfuse
      depends_on:
        postgres:
          condition: service_healthy
        clickhouse:
          condition: service_healthy
      ports:
        - "${LANGFUSE_PORT:-3001}:3000"
      environment:

        DATABASE_URL: "postgresql://${MINIO_ACCESS_KEY:-kms_user}:${MINIO_SECRET_KEY:-kms_password}@postgres:5432/langfuse_db?schema=public"

        CLICKHOUSE_HOST: "clickhouse"
        CLICKHOUSE_PORT: "8123"
        CLICKHOUSE_DATABASE: "langfuse"
        CLICKHOUSE_USERNAME: "default"
        CLICKHOUSE_PASSWORD: ""


        SALT: "${LANGFUSE_SALT}"
        LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY}"
        LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY}"
        LANGFUSE_HOST: "${LANGFUSE_HOST:-http://localhost:3001}"

        TELEMETRY_ENABLED: "false"
      volumes:
        - langfuse_data:/data

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9002:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  # neo4j_data:
  grafana_data:
  langfuse_data:
  clickhouse_data: