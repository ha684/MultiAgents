services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: kms_user
      POSTGRES_PASSWORD: kms_password
      POSTGRES_DB: kms_db
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${DATABASE_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./etc/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kms_user -d kms_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
      image: redis/redis-stack-server:latest
      container_name: redis
      ports:
        - "${REDIS_PORT:-6379}:6379"
      volumes:
        - redis_data:/data  
      environment:
        - REDIS_ARGS=--requirepass ${REDIS_AUTH:-myredissecret}
      healthcheck:
        test: ["CMD", "redis-cli", "-a", "${REDIS_AUTH:-myredissecret}", "ping"]
        interval: 10s
        timeout: 5s
        retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "${KAFKA_CONTROLLER_PORT:-9093}:9093"
    environment:
      # KRaft mode configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Log retention (24 hours)
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_RETENTION_HOURS:-24}
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      # Performance tuning
      KAFKA_NUM_PARTITIONS: ${KAFKA_PARTITIONS:-6}
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Cluster ID
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo 'Waiting for Kafka to be ready...'
      sleep 5
      
      # Create LLM responses topic
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
        --create --if-not-exists \
        --topic llm.responses \
        --partitions ${KAFKA_PARTITIONS:-6} \
        --replication-factor 1 \
        --config retention.ms=${KAFKA_RETENTION_MS:-86400000}
      
      echo 'Kafka topics created successfully'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
      "

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # qdrant:
  #   image: qdrant/qdrant:latest
  #   container_name: qdrant
  #   ports:
  #     - "${QDRANT_HTTP_PORT:-6333}:6333"
  #     - "${QDRANT_GRPC_PORT:-6334}:6334"
  #   volumes:
  #     - qdrant_data:/qdrant/storage
  #   environment:
  #     - QDRANT_ALLOW_RECOVERY_MODE=true

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET:-langfuse}
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO...';
      /usr/bin/mc alias set myminio http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY};
      /usr/bin/mc mb myminio/$${MINIO_BUCKET} --ignore-existing;
      /usr/bin/mc anonymous set download myminio/$${MINIO_BUCKET};
      echo 'MinIO initialization done';
      exit 0;
      "

  worker:
    image: hapt
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ../:/app:cached
    environment:
      - REDIS_URI=redis://:${REDIS_AUTH:-myredissecret}@redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://kms_user:kms_password@postgres:5432/kms_db
      - VECTOR_STORAGE_URL=${VECTOR_STORAGE_URL}
      - VECTOR_STORAGE_API_KEY=${VECTOR_STORAGE_API_KEY}
      - VECTOR_COLLECTION_NAME=${VECTOR_COLLECTION_NAME}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET:-langfuse}
      - MINIO_SECURE=${MINIO_SECURE:-false}
      - RERANK_URL=${RERANK_URL}
      - RERANK_API_KEY=${RERANK_API_KEY}
      - TEXT_EMBEDDING_URL=${TEXT_EMBEDDING_URL}
      - TEXT_EMBEDDING_API_KEY=${TEXT_EMBEDDING_API_KEY}
      - TEXT_EMBEDDING_MODEL=${TEXT_EMBEDDING_MODEL}
      - NTQAI_BASE_URL=${NTQAI_BASE_URL}
      - NTQAI_API_KEY=${NTQAI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_API_MODEL=${GOOGLE_API_MODEL}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS}
      - NTQAI_MODEL=${NTQAI_MODEL}
      - TEMPERATURE=${TEMPERATURE}
      # RabbitMQ for Celery
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      # Kafka for streaming
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC_LLM_RESPONSES=llm.responses
      - KAFKA_SECURITY_PROTOCOL=PLAINTEXT
      # vLLM config
      - VLLM_BASE_URL=${VLLM_BASE_URL:-}
      - VLLM_API_KEY=${VLLM_API_KEY:-}
      - VLLM_MODEL=${VLLM_MODEL:-}
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
    command: python -m src.worker

  streaming-worker:
    image: hapt
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ../:/app:cached
    environment:
      - REDIS_URI=redis://:${REDIS_AUTH:-myredissecret}@redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://kms_user:kms_password@postgres:5432/kms_db
      - VECTOR_STORAGE_URL=${VECTOR_STORAGE_URL}
      - VECTOR_STORAGE_API_KEY=${VECTOR_STORAGE_API_KEY}
      - VECTOR_COLLECTION_NAME=${VECTOR_COLLECTION_NAME}
      - RERANK_URL=${RERANK_URL}
      - RERANK_API_KEY=${RERANK_API_KEY}
      - TEXT_EMBEDDING_URL=${TEXT_EMBEDDING_URL}
      - TEXT_EMBEDDING_API_KEY=${TEXT_EMBEDDING_API_KEY}
      - TEXT_EMBEDDING_MODEL=${TEXT_EMBEDDING_MODEL}
      - NTQAI_BASE_URL=${NTQAI_BASE_URL}
      - NTQAI_API_KEY=${NTQAI_API_KEY}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS}
      - NTQAI_MODEL=${NTQAI_MODEL}
      # RabbitMQ for Celery
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      # Kafka for streaming
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC_LLM_RESPONSES=llm.responses
      - KAFKA_SECURITY_PROTOCOL=PLAINTEXT
      # vLLM config
      - VLLM_BASE_URL=${VLLM_BASE_URL:-}
      - VLLM_API_KEY=${VLLM_API_KEY:-}
      - VLLM_MODEL=${VLLM_MODEL:-}
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
    command: python -m src.streaming_worker

