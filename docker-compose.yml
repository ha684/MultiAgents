services:
  postgres:
    image: postgres:15
    container_name: kms-postgres
    environment:
      POSTGRES_USER: kms_user
      POSTGRES_PASSWORD: kms_password
      POSTGRES_DB: kms_db
    ports:
      - "${DATABASE_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kms_user -d kms_db"]
      interval: 10s
      timeout: 5s
      retries: 5

