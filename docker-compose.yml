  kms-worker:
    image: hapt 
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      # kms-app:
      #   condition: service_healthy
      # neo4j:
      #   condition: service_healthy
    volumes:
      - ./src:/app/src:cached
      - .:/app:cached
    environment:
      - REDIS_URI=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://kms_user:kms_password@postgres:5432/kms_db
      - SYNC_DATABASE_URL=${SYNC_DATABASE_URL}
      - VECTOR_STORAGE_URL=http://qdrant:6333
      - VECTOR_COLLECTION_NAME=${VECTOR_COLLECTION_NAME}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - MINIO_SECURE=${MINIO_SECURE}
      - RERANK_URL=${RERANK_URL}
      - RERANK_API_KEY=${RERANK_API_KEY}
      - TEXT_EMBEDDING_URL=${TEXT_EMBEDDING_URL}
      - TEXT_EMBEDDING_API_KEY=${TEXT_EMBEDDING_API_KEY}
      - TEXT_EMBEDDING_MODEL=${TEXT_EMBEDDING_MODEL}
      - NTQAI_BASE_URL=${NTQAI_BASE_URL}
      - NTQAI_API_KEY=${NTQAI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_API_MODEL=${GOOGLE_API_MODEL}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS}
      - NTQAI_MODEL=${NTQAI_MODEL}
      - TEMPERATURE=${TEMPERATURE}
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
    command: python -m src.worker
  
