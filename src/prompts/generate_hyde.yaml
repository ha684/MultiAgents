prompt_en: |
  You are an expert writer specializing in generating clear and detailed explanations.

  <GOAL>
    Based on the following project overview and the user query, generate a hypothetical document in English that someone might write in response.
  </GOAL>

  <REQUIREMENTS>
    1. Be relevant to the user query.
    2. Be based on the context provided in the project overview.
    3. Be detailed, coherent, and contextually appropriate.
    4. Not exceed 100 words in total.
  </REQUIREMENTS>
  
  ### **Project Overview**: {project_overview}
  Question: {question}

  Hypothetical Document (in English):

prompt_ja: |
 あなたは、明確で詳細な説明を作成する専門のライターです。

  <目標>
    以下のプロジェクト概要とユーザーの質問に基づいて、日本語で誰かが書く可能性のある仮想的な文書を作成してください。
  </目標>

  <要件>
    1. ユーザーの質問に関連していること。
    2. プロジェクト概要で提供されたコンテキストに基づいていること。
    3. 詳細で、一貫性があり、文脈に適していること。
    4. 合計100単語を超えないこと。
  </要件>

  ### **プロジェクト概要**: {project_overview}
  ### **質問**: {question}

  仮想的な文書（日本語）:

prompt_ko: |
  당신은 명확하고 상세한 설명을 작성하는 전문 작가입니다.

  <목표>
    아래 프로젝트 개요와 사용자의 질문에 근거하여 한국어로 가상의 문서를 작성하세요.
  </목표>

  <요구사항>
    1. 사용자 질문과 관련 있어야 합니다.
    2. 프로젝트 개요의 컨텍스트에 기반해야 합니다.
    3. 상세하고 일관성 있으며 문맥에 맞아야 합니다.
    4. 총 100단어를 넘지 않아야 합니다.
  </요구사항>

  ### **프로젝트 개요**: {project_overview}
  ### **질문**: {question}

  가상 문서 (한국어):

prompt_vi: |
  Bạn là một nhà văn chuyên nghiệp chuyên tạo ra các giải thích rõ ràng và chi tiết.

  <MỤC TIÊU>
    Dựa trên tổng quan dự án sau đây và truy vấn của người dùng, tạo một tài liệu giả định bằng tiếng Việt mà ai đó có thể viết để phản hồi.
  </MỤC TIÊU>

  <YÊU CẦU>
    1. Phù hợp với truy vấn của người dùng.
    2. Dựa trên bối cảnh được cung cấp trong tổng quan dự án.
    3. Chi tiết, mạch lạc và phù hợp với ngữ cảnh.
    4. Không vượt quá 100 từ.
  </YÊU CẦU>

  ### **Tổng Quan Dự Án**: {project_overview}
  ### **Câu Hỏi**: {question}

  Tài liệu giả định (bằng tiếng Việt):