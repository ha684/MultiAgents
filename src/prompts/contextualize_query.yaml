prompt_vi: |
  Bạn là một trợ lý AI tiên tiến.

  <MỤC TIÊU>
  Phân tích **lịch sử trò chuyện** và **câu hỏi mới nhất của người dùng**, sau đó xác định xem câu hỏi có phụ thuộc vào ngữ cảnh trước đó hay không.
  </MỤC TIÊU>

  <YÊU CẦU>
    1. Nếu câu hỏi **phụ thuộc vào lịch sử trò chuyện**, hãy viết lại nó thành một **câu hỏi độc lập, rõ ràng**, giữ nguyên ý định ban đầu nhưng có thể hiểu mà không cần ngữ cảnh trước đó.
    2. Nếu câu hỏi **đã độc lập và rõ ràng**, giữ nguyên nó.
    3. **Không được trả lời câu hỏi**—chỉ trả về câu hỏi đã chỉnh sửa hoặc nguyên bản.
    4. Giữ nguyên ngôn ngữ và ý nghĩa ban đầu của câu hỏi.
  </YÊU CẦU>

  ### **Đầu vào**: 
    **lịch_sử_trò_chuyện**: 
      {chat_history}
    **câu_hỏi_mới_nhất**: {question}

  ### **Đầu ra**: 


prompt_en: |
  You are an advanced AI assistant.

  <GOAL>
  Analyze the **chat history** and the **latest user question**, then determine if the question depends on prior context.
  </GOAL>

  <REQUIREMENTS>
    1. If the question **relies on chat history**, rewrite it as a **clear, standalone question** that retains its original intent but can be understood without context.
    2. If the question is **already standalone**, return it unchanged.
    3. Do **not** answer the question—your output must only be the reformulated or original question.
    4. Maintain the language of the original question.
  </REQUIREMENTS>

  ### **Inputs**: 
    **chat_history**: 
      {chat_history}
    **latest_user_question**: {question}

  ### **Outputs**: 
    **Standalone_question**: "Reformulated or original question."


prompt_ja: |
  あなたは高度なAIアシスタントです。

  <目標>
  **チャット履歴** と **最新のユーザーの質問** を分析し、その質問が前のコンテキストに依存しているかどうかを判断します。
  <目標>

  <要件>
    1. 質問が**チャット履歴に依存している場合**、**明確で独立した質問** に書き換え、元の意図を保持しつつ、前のコンテキストなしで理解できるようにする。
    2. 質問が**すでに独立している場合**、そのまま返す。
    3. **質問に答えてはいけません**—書き換えた質問または元の質問のみを出力すること。
    4. 質問の元の言語と意味を保持する。
  <要件>

  ### **入力**: 
    **チャット履歴**: 
      {chat_history}
    **最新のユーザー質問**: {question}

  ### **出力**: 
    **独立した質問**: "書き換えられた質問、または元の質問。（日本語）"

prompt_ko: |
  당신은 고급 AI 어시스턴트입니다.

  <목표>
  **대화 내역**과 **최신 사용자 질문**을 분석하여 질문이 이전 컨텍스트에 의존하는지 판단합니다.
  </목표>

  <요구사항>
    1. 질문이 **대화 내역에 의존하면**, 명확하고 독립적인 질문으로 다시 작성하여 원래 의도를 유지하되 별도 컨텍스트 없이 이해 가능하게 만듭니다.
    2. 질문이 **이미 독립적이면**, 그대로 반환합니다.
    3. **질문에 답하지 마십시오**—다시 작성된 질문 또는 원문만 출력합니다.
    4. 질문의 원 언어와 의미를 유지합니다.
  </요구사항>

  ### **입력**: 
    **대화 내역**: 
      {chat_history}
    **최신 사용자 질문**: {question}

  ### **출력**: 
    **독립 질문**: "다시 작성된 질문 또는 원문"
