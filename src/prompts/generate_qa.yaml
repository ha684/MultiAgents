prompt_en: |
  Your task is to create exactly one question and one answer based on the provided input.

  <GUIDELINES>:
  1. The question must be clear, concise, and accurately reflect the content of the input.
  2. The answer must be precise, detailed, and relevant to the question without adding information beyond the input.
  3. If the input lacks sufficient information to create a meaningful question and answer, return a question and answer suitable for the remaining content.
  4. The languague of the question and answer should only be English.
  5. Return exactly one question and one answer only.
  </GUIDELINES>

  <EXAMPLE>:
  Input: "Renewable energy provides an environmentally friendly alternative to fossil fuels."
  Output: {{"question": "What are the advantages of renewable energy?", "answer": "Renewable energy provides an environmentally friendly alternative to fossil fuels."}}
  </EXAMPLE>

  ### Input:
  {input}

  ### Output:
  The output must be in exact proper valid JSON format, with no extra spaces or line breaks, with special characters properly escaped, following this structure:
  {{"question": "Generated question", "answer": "Generated answer: but with \"quotes\""}}

  ## Remember:
  JSON only allows certain characters to be escaped, such as double quotes, backslashes, and control characters. Ensure that your output adheres to this format strictly.
  DO NOT escape characters that do not require escaping in JSON, such as underscores or spaces. The output must be a valid JSON object with the keys "question" and "answer".

prompt_vi: |
  Nhiệm vụ của bạn là tạo chính xác một câu hỏi và một câu trả lời dựa trên thông tin đầu vào được cung cấp.

  <HƯỚNG DẪN>:
  1. Câu hỏi phải rõ ràng, ngắn gọn và phản ánh chính xác nội dung của đầu vào.
  2. Câu trả lời phải chính xác, chi tiết và liên quan trực tiếp đến câu hỏi mà không thêm thông tin ngoài nội dung đầu vào.
  3. Nếu đầu vào không có đủ thông tin để tạo câu hỏi và câu trả lời có ý nghĩa, hãy tạo một câu hỏi và câu trả lời phù hợp với nội dung còn lại.
  4. Ngôn ngữ của câu hỏi và câu trả lời chỉ được sử dụng tiếng Việt.
  5. Chỉ trả về duy nhất một câu hỏi và một câu trả lời theo định dạng JSON chính xác, không có khoảng trắng hoặc dòng trống thừa.

  </HƯỚNG DẪN>

  <VÍ DỤ>:
  Input: "Năng lượng tái tạo cung cấp một giải pháp thân thiện với môi trường thay thế nhiên liệu hóa thạch."
  Output: {{"question": "Lợi ích của năng lượng tái tạo là gì?", "answer": "Năng lượng tái tạo cung cấp một giải pháp thân thiện với môi trường thay thế nhiên liệu hóa thạch."}}

  ### Input:
  {input}

  ### Output:
  Đầu ra phải theo định dạng JSON chính xác, không có dấu cách hoặc ngắt dòng thừa, với các ký tự đặc biệt được thoát đúng cách, tuân thủ cấu trúc sau:
  {{"question": "Câu hỏi được tạo", "answer": "Câu trả lời được tạo: nhưng có \"dấu ngoặc kép\""}}

  ## Remember:
  JSON chỉ cho phép một số ký tự được thoát, chẳng hạn như dấu ngoặc kép, dấu gạch chéo ngược và các ký tự điều khiển. Đảm bảo rằng đầu ra của bạn tuân thủ định dạng này một cách nghiêm ngặt.
  KHÔNG thoát các ký tự không cần thiết trong JSON, chẳng hạn như dấu gạch dưới hoặc khoảng trắng. Đầu ra phải là một đối tượng JSON hợp lệ với các khóa "question" và "answer".

prompt_ko: |
  당신의 임무는 주어진 입력에 근거해 정확히 하나의 질문과 하나의 답변을 생성하는 것입니다.

  <지침>:
  1. 질문은 명확하고 간결하며 입력 내용을 정확히 반영해야 합니다.
  2. 답변은 정확하고 상세하며 관련성이 있어야 하며 입력 범위를 넘어선 정보를 추가하지 않습니다.
  3. 입력에 충분한 정보가 없으면, 남은 내용에 적합한 질문과 답변을 만듭니다.
  4. 질문과 답변은 한국어로만 작성해야 합니다.
  5. 불필요한 공백이나 줄바꿈 없이 정확한 JSON 형식으로 하나의 질문과 하나의 답변만 반환하세요.

  </지침>

  <예시>:
  Input: "재생 가능한 에너지는 화석 연료의 친환경적 대안입니다."
  Output: {{"question": "재생 가능한 에너지의 장점은 무엇입니까?", "answer": "재생 가능한 에너지는 화석 연료의 친환경적 대안입니다."}}

  ### Input:
  {input}

  ### Output:
  출력은 추가 공백이나 줄 바꿈 없이 정확한 JSON 형식이어야 하며, 특수 문자는 적절하게 이스케이프 처리되고 다음 구조를 따라야 합니다:
  {{"question": "생성된 질문", "answer": "생성된 답변: 하지만 \"따옴표\" 포함"}}

  ### Remember:
  JSON은 특정 문자만 이스케이프할 수 있습니다. 예를 들어, 큰따옴표, 역슬래시, 제어 문자 등이 있습니다. 출력이 이 형식을 엄격히 준수해야 합니다.
  JSON에서 밑줄이나 공백과 같은 불필요한 문자는 이스케이프 처리하지 마세요. 출력은 "question"과 "answer" 키를 가진 유효한 JSON 객체여야 합니다.

prompt_ja: |
  あなたのタスクは、与えられた入力に基づいて、正確に1つの質問と1つの回答を作成することです。

  <ガイドライン>:
  1. 質問は明確で簡潔であり、入力内容を正確に反映している必要があります。
  2. 回答は正確で詳細かつ関連性があり、入力情報を超えた内容を追加しないこと。
  3. 入力に意味のある質問と回答を作成するのに十分な情報がない場合は、残りの内容に適した質問と回答を作成してください。
  4. 質問と回答の言語は日本語のみとすること。
  5. 余分なスペースや改行を含まない、正確なJSON形式で1つの質問と1つの回答のみを返してください。

  </ガイドライン>

  <例>:
  Input: "再生可能エネルギーは、化石燃料に代わる環境に優しい選択肢を提供します。"
  Output: {{"question": "再生可能エネルギーの利点は何ですか？", "answer": "再生可能エネルギーは、化石燃料に代わる環境に優しい選択肢を提供します。"}}

  ### Input:
  {input}

  ### Output:
  出力は、余分なスペースや改行を含まず、特殊文字が適切にエスケープされ、以下の構造に従った正確なJSON形式である必要があります。
  {{"question": "生成された質問", "answer": "生成された回答: ただし「引用符」を含む"}}

  ## Remember:
  JSONは特定の文字のみをエスケープできます。例えば、二重引用符、バックスラッシュ、制御文字などです。出力がこの形式に厳密に従うことを確認してください。
  不要な文字（アンダースコアやスペースなど）をエスケープしないでください。出力は、"question"と"answer"のキーを持つ有効なJSONオブジェクトでなければなりません。
