version: 1
disable_existing_loggers: false

formatters:
  default:
    (): uvicorn.logging.DefaultFormatter
    fmt: "%(levelprefix)s %(asctime)s - %(message)s"
  access:
    (): uvicorn.logging.AccessFormatter
    fmt: '%(levelprefix)s %(client_addr)s - "%(request_line)s" %(status_code)s'

handlers:
  default:
    formatter: default
    class: logging.StreamHandler
    stream: ext://sys.stderr
  access:
    formatter: access
    class: logging.StreamHandler
    stream: ext://sys.stdout

loggers:
  # Cấu hình cho logger báo lỗi của uvicorn
  uvicorn.error:
    level: INFO
    handlers: [default]
    propagate: no # Ngăn không cho log lan truyền lên logger gốc

  # Cấu hình cho logger báo access của uvicorn
  uvicorn.access:
    level: INFO
    handlers: [access]
    propagate: no
